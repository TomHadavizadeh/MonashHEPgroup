# GitHub Actions for the Monash Particle Physics website.
#
#  * On every pull request: validate all Markdown files and build the site.
#    If someone's card has a mistake, the check fails with a clear message,
#    and the built site is attached as a "site-preview" artifact.
#  * On pushes to main: build and publish to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check content
        run: python build.py --check

      - name: Build site
        run: python build.py --out public

      - name: Upload preview (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: public
          retention-days: 7

      - name: Upload Pages artifact (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
